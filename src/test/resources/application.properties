server.port=8080
spring.application.name=fase4-payment-service

spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.sqs.endpoint=https://sqs.us-east-1.amazonaws.com

# Desabilitar importação de secrets do AWS durante os testes
spring.config.import=optional:aws-secretsmanager:fase4-payment-service-secrets

# Configurações mockadas para testes
fase4.payment.service.marcadopago.webhookUrl=http://localhost:8080/payment/webhook
fase4.payment.service.marcadopago.accessToken=test-token
fase4.payment.service.marcadopago.userId=test-user-id
fase4.payment.service.marcadopago.externalPosId=test-pos-id
